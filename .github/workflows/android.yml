name: Android preview
on:
  workflow_dispatch:
    inputs:
      origin:
        description: HTTPS origin of the CeZeOs Region
        required: true
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CEZEOS_APP_ORIGIN: ${{ inputs.origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p mobile/android assembleDebug signingReport --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cezeos-android-preview
          path: mobile/android/app/build/outputs/apk/debug/*.apk
